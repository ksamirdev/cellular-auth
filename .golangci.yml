version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      # Closing a response body or a listener we are done with has no useful
      # error to handle, and the chaos report writes to stdout.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (net.Listener).Close
        - fmt.Fprintf
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ksamirdev/cellular-auth
