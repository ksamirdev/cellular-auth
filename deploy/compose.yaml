# Four cells, each with its own Postgres, behind one router.
# Chaos run: docker compose -f deploy/compose.yaml --profile chaos run --rm chaos

name: cellular-auth

x-cell: &cell
  build: { context: .., dockerfile: deploy/Dockerfile }
  image: cellular-auth:dev
  command: [cell]
  restart: "no"

x-postgres: &postgres
  image: mirror.gcr.io/library/postgres:17-alpine
  environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: cell }
  command: [postgres, -c, max_connections=200, -c, synchronous_commit=on]
  healthcheck: { test: [CMD, pg_isready, -U, postgres], interval: 1s, retries: 30 }

services:
  pg-1:
    <<: *postgres
    ports: ["5441:5432"]

  cell-1:
    <<: *cell
    environment:
      CELL_ID: cell-1
      CELL_ADDR: ":8101"
      DATABASE_URL: postgres://postgres:postgres@pg-1:5432/cell?sslmode=disable
    ports: ["8101:8101"]
    depends_on: { pg-1: { condition: service_healthy } }

  pg-2:
    <<: *postgres
    ports: ["5442:5432"]

  cell-2:
    <<: *cell
    environment:
      CELL_ID: cell-2
      CELL_ADDR: ":8101"
      DATABASE_URL: postgres://postgres:postgres@pg-2:5432/cell?sslmode=disable
    ports: ["8102:8101"]
    depends_on: { pg-2: { condition: service_healthy } }

  pg-3:
    <<: *postgres
    ports: ["5443:5432"]

  cell-3:
    <<: *cell
    environment:
      CELL_ID: cell-3
      CELL_ADDR: ":8101"
      DATABASE_URL: postgres://postgres:postgres@pg-3:5432/cell?sslmode=disable
    ports: ["8103:8101"]
    depends_on: { pg-3: { condition: service_healthy } }

  pg-4:
    <<: *postgres
    ports: ["5444:5432"]

  cell-4:
    <<: *cell
    environment:
      CELL_ID: cell-4
      CELL_ADDR: ":8101"
      DATABASE_URL: postgres://postgres:postgres@pg-4:5432/cell?sslmode=disable
    ports: ["8104:8101"]
    depends_on: { pg-4: { condition: service_healthy } }

  router:
    image: cellular-auth:dev
    command: [router]
    environment:
      CELLS: cell-1=http://cell-1:8101,cell-2=http://cell-2:8101,cell-3=http://cell-3:8101,cell-4=http://cell-4:8101
    ports: ["8080:8080"]
    depends_on: [cell-1, cell-2, cell-3, cell-4]

  replicator:
    image: cellular-auth:dev
    command: [replicator]
    environment:
      CELLS: cell-1=http://cell-1:8101,cell-2=http://cell-2:8101,cell-3=http://cell-3:8101,cell-4=http://cell-4:8101
    ports: ["8090:8090"]
    depends_on: [cell-1, cell-2, cell-3, cell-4]

  # Runs inside the network: going through OrbStack's host port
  # forwarding added a 1s p99.9 that had nothing to do with the system.
  chaos:
    profiles: [chaos]
    build: { context: .., dockerfile: deploy/Dockerfile, target: chaos }
    image: cellular-auth-chaos:dev
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    command:
      - -router=http://router:8080
      - -victim=cell-2
      - -kill=docker kill cellular-auth-cell-2-1
      - -revive=docker start cellular-auth-cell-2-1
      - -dbs=cell-1=postgres://postgres:postgres@pg-1:5432/cell?sslmode=disable,cell-2=postgres://postgres:postgres@pg-2:5432/cell?sslmode=disable,cell-3=postgres://postgres:postgres@pg-3:5432/cell?sslmode=disable,cell-4=postgres://postgres:postgres@pg-4:5432/cell?sslmode=disable
    depends_on: [router, replicator]
